name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          echo "=== Building APK ==="
          buildozer android debug 2>&1 | tail -100
          echo "=== Build exit code: $? ==="
          echo "=== Files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No bin directory"
          echo "=== All files in workspace ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wenwen-apk
          path: bin/*.apk
