name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          set -o pipefail
          echo "=== Building APK (output saved to build.log) ==="
          buildozer android debug > build.log 2>&1
          BUILD_EXIT=$?
          echo "=== Build exit code: $BUILD_EXIT ==="
          echo ""
          echo "=== Last 80 lines of build log ==="
          tail -80 build.log
          echo ""
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== Contents of bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No bin directory"
          exit $BUILD_EXIT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wenwen-apk
          path: "**/*.apk"
